ript adiciona a coluna da capa</tspan></text><path d="M 408 436 V 466" fill="none" stroke="#666f69" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="476" width="672" height="82" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="408.0" y="525.91" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="408.0" dy="0">O servidor cria tabelas e abre o atendimento</tspan></text><rect x="856" y="237" width="672" height="83" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1192.0" y="270.18" font-size="26" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1192.0" dy="0">db:migrate</tspan><tspan x="1192.0" dy="33.800000000000004">Aplica e registra as migrações</tspan></text><text x="1192" y="361.0" font-size="17" font-weight="600" text-anchor="middle" fill="#737c75"><tspan x="1192" dy="0">AO INICIAR O SERVIDOR</tspan></text><rect x="856" y="386" width="672" height="76" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1192.0" y="432.58" font-size="26" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1192.0" dy="0">Confere versão e estrutura do banco</tspan></text><path d="M1192 462 V 486 M1012 486 H1372 M1012 486 V508 M1372 486 V508" fill="none" stroke="#666f69" stroke-width="1.8"/><rect x="856" y="511" width="312" height="80" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1012.0" y="543.3199999999999" font-size="24" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1012.0" dy="0">Compatível:</tspan><tspan x="1012.0" dy="31.200000000000003">abre o servidor</tspan></text><rect x="1216" y="511" width="312" height="80" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1372.0" y="543.3199999999999" font-size="24" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1372.0" dy="0">Incompatível:</tspan><tspan x="1372.0" dy="31.200000000000003">bloqueia o início</tspan></text><path d="M38 663 H1562" stroke="#b4bcb5" stroke-width="1"/><tex