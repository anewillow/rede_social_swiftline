<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#666f69" stroke-width="1.3"/></marker></defs><rect width="1600" height="720" fill="#fbfcfa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="42" y="51.0" font-size="18" font-weight="600" text-anchor="start" fill="#777e78"><tspan x="42" dy="0">05 / 06</tspan></text><text x="42" y="99.0" font-size="43" font-weight="650" text-anchor="start" fill="#363a39"><tspan x="42" dy="0">Gravação de ações com notificações</tspan></text><rect x="38" y="130" width="740" height="502" fill="#ffffff" stroke="#c2c7c2" stroke-width="1.5"/><text x="66" y="166.0" font-size="19" font-weight="650" text-anchor="start" fill="#737c75"><tspan x="66" dy="0">ANTES</tspan></text><text x="66" y="203.0" font-size="27" font-weight="600" text-anchor="start" fill="#363a39"><tspan x="66" dy="0">As gravações ficam separadas.</tspan></text><rect x="822" y="130" width="740" height="502" fill="#ffffff" stroke="#c2c7c2" stroke-width="1.5"/><text x="850" y="166.0" font-size="19" font-weight="650" text-anchor="start" fill="#737c75"><tspan x="850" dy="0">DEPOIS</tspan></text><text x="850" y="203.0" font-size="27" font-weight="600" text-anchor="start" fill="#363a39"><tspan x="850" dy="0">As gravações usam uma transação.</tspan></text><rect x="72" y="232" width="672" height="82" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="408.0" y="281.91" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="408.0" dy="0">Grava a ação</tspan></text><path d="M 408 314 V 344" fill="none" stroke="#666f69" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="354" width="672" height="82" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="408.0" y="403.91" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="408.0" dy="0">Tenta gravar a notificação</tspan></text><path d="M 408 436 V 466" fill="none" stroke="#666f69" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="476" width="672" height="82" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="408.0" y="525.91" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="408.0" dy="0">Se a notificação falhar, a ação fica salva</tspan></text><rect x="856" y="235" width="672" height="230" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1192" y="276.0" font-size="21" font-weight="650" text-anchor="middle" fill="#363a39"><tspan x="1192" dy="0">UMA TRANSAÇÃO</tspan></text><rect x="882" y="300" width="620" height="59" fill="#ffffff" stroke="#939995" stroke-width="1.4"/><text x="1192.0" y="338.41" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1192.0" dy="0">Grava a ação</tspan></text><path d="M 1192 359 V 377" fill="none" stroke="#666f69" stroke-width="2" marker-end="url(#arrow)"/><rect x="882" y="385" width="620" height="59" fill="#ffffff" stroke="#939995" stroke-width="1.4"/><text x="1192.0" y="423.41" font-size="27" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1192.0" dy="0">Grava a notificação</tspan></text><path d="M 1192 465 V 493" fill="none" stroke="#666f69" stroke-width="2" marker-end="url(#arrow)"/><rect x="856" y="505" width="672" height="83" fill="#f2f3f1" stroke="#939995" stroke-width="1.4"/><text x="1192.0" y="538.5" font-size="25" font-weight="500" text-anchor="middle" fill="#363a39"><tspan x="1192.0" dy="0">Sucesso: confirma as duas</tspan><tspan x="1192.0" dy="32.5">Falha: desfaz a operação</tspan></text><path d="M38 663 H1562" stroke="#b4bcb5" stroke-width="1"/><text x="38" y="700.0" font-size="25" font-weight="600" text-anchor="start" fill="#363a39"><tspan x="38" dy="0">Quando a ação exige notificação, a confirmação abrange as duas gravações.</tspan></text></g></svg>